name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  build-firmware:
    name: Build firmware (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        environment: [t-poe-pro, esp32-s3-eth, waveshare-esp32p4-eth]
    env:
      USERPROFILE: /home/runner
      PYTHONUTF8: "1"
      ESP32_OT_EMBEDDED_CREDENTIALS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned build tools
        run: python -m pip install platformio==6.1.18 esptool==4.9.0
      - name: Build firmware and LittleFS
        run: |
          pio run -e "${{ matrix.environment }}"
          pio run -e "${{ matrix.environment }}" -t buildfs
      - name: Scan generated firmware artifacts
        run: |
          BD="$USERPROFILE/.platformio/build/ESP32-OT-Security-Assessment/${{ matrix.environment }}"
          python scripts/check_release_secrets.py --path "$BD/generated" --path "$BD/firmware.bin" --path "$BD/littlefs.bin"
      - name: Upload short-lived diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-diagnostics-${{ matrix.environment }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            /home/runner/.platformio/build/ESP32-OT-Security-Assessment/${{ matrix.environment }}/firmware.bin
            /home/runner/.platformio/build/ESP32-OT-Security-Assessment/${{ matrix.environment }}/*.map

  release-secret-scan:
    name: Release secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_release_secrets.py --repository .
