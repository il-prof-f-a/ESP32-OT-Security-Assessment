[platformio]
# Keep build artifacts outside OneDrive-synced workspace to avoid transient
# directory lock/removal issues during parallel compilation on Windows.
build_dir = ${sysenv.USERPROFILE}/.platformio/build/ESP32-OT-Security-Assessment

[env:t-poe-pro]
platform = espressif32@6.12.0
board = esp32dev
framework = espidf

# Configure the T-POE Pro 16 MB flash.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

# Board-specific build flags
build_flags =
    -DLILYGO_T_ETH_POE_PRO
    -DBOARD_TPOE_PRO
    -DESP32_OT_WEB_HTTP_ONLY=1
    -DETH_PHY_TYPE=8720
    -DETH_PHY_ADDR=0
    -DETH_PHY_RST_GPIO=5
    -DETH_MDC_GPIO=23
    -DETH_MDIO_GPIO=18
    -DETH_RMII_CLK_MODE=EMAC_CLK_OUT
    -DETH_RMII_CLK_GPIO=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_LITTLEFS_MAX_PARTITIONS=3
    -DCONFIG_ETH_ENABLE_PROMISCUOUS=1
    # NVS override for PSRAM stack safety
    -Wl,--wrap=nvs_open
    -Wl,--wrap=nvs_set_str
    -Wl,--wrap=nvs_get_str
    -Wl,--wrap=nvs_set_blob
    -Wl,--wrap=nvs_get_blob
    -Wl,--wrap=nvs_set_u8
    -Wl,--wrap=nvs_get_u8
    -Wl,--wrap=nvs_set_u16
    -Wl,--wrap=nvs_get_u16
    -Wl,--wrap=nvs_set_u32
    -Wl,--wrap=nvs_get_u32
    -Wl,--wrap=nvs_set_i8
    -Wl,--wrap=nvs_get_i8
    -Wl,--wrap=nvs_set_i16
    -Wl,--wrap=nvs_get_i16
    -Wl,--wrap=nvs_set_i32
    -Wl,--wrap=nvs_get_i32
    -Wl,--wrap=nvs_erase_key
    -Wl,--wrap=nvs_commit
    -Wl,--wrap=nvs_close
    -Wl,--wrap=nvs_flash_erase
    -Wl,--wrap=nvs_flash_init

# Custom partition table for 16MB flash
board_build.partitions = partitions.csv

# Serial configuration
upload_speed =  921600
monitor_speed = 115200

# Pre-build provisioning and web UI generation.
extra_scripts =
  pre:scripts/platformio_provision.py
  pre:scripts/convert_html_in_code.py

board_build.sdkconfig_defaults = sdkconfig.defaults

[env:esp32-s3-eth]
platform = espressif32@6.12.0
board = esp32-s3-eth
framework = espidf

board_build.flash_size = 16MB
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_ESP32_S3_ETH
    -DESP32_OT_WEB_HTTP_ONLY=0
    -DBOARD_HAS_PSRAM
    -DETH_PHY_TYPE=5500
    -DETH_PHY_ADDR=1
    -DETH_PHY_RST_GPIO=9
    -DETH_SPI_HOST=SPI2_HOST
    -DETH_SPI_SCLK_GPIO=13
    -DETH_SPI_MOSI_GPIO=11
    -DETH_SPI_MISO_GPIO=12
    -DETH_SPI_CS_GPIO=14
    -DETH_SPI_INT_GPIO=10
    -DETH_SPI_CLOCK_MHZ=20
    -DCONFIG_LITTLEFS_MAX_PARTITIONS=3
    -DCONFIG_ETH_ENABLE_PROMISCUOUS=1
    # NVS override for PSRAM stack safety
    -Wl,--wrap=nvs_open
    -Wl,--wrap=nvs_set_str
    -Wl,--wrap=nvs_get_str
    -Wl,--wrap=nvs_set_blob
    -Wl,--wrap=nvs_get_blob
    -Wl,--wrap=nvs_set_u8
    -Wl,--wrap=nvs_get_u8
    -Wl,--wrap=nvs_set_u16
    -Wl,--wrap=nvs_get_u16
    -Wl,--wrap=nvs_set_u32
    -Wl,--wrap=nvs_get_u32
    -Wl,--wrap=nvs_set_i8
    -Wl,--wrap=nvs_get_i8
    -Wl,--wrap=nvs_set_i16
    -Wl,--wrap=nvs_get_i16
    -Wl,--wrap=nvs_set_i32
    -Wl,--wrap=nvs_get_i32
    -Wl,--wrap=nvs_erase_key
    -Wl,--wrap=nvs_commit
    -Wl,--wrap=nvs_close
    -Wl,--wrap=nvs_flash_erase
    -Wl,--wrap=nvs_flash_init

board_build.partitions = partitions.csv

upload_speed = 921600
monitor_speed = 115200

extra_scripts =
  pre:scripts/platformio_provision.py
  pre:scripts/convert_html_in_code.py

board_build.sdkconfig_defaults = sdkconfig.esp32s3eth.defaults

[env:waveshare-esp32p4-eth]
# ESP32-P4 support is provided by the pioarduino fork pinned to the
# revision used by the hardware-tested private project. The stock
# espressif32@6.12.0 platform maps esp32p4 to an Xtensa toolchain and cannot
# build this RISC-V target.
platform = https://github.com/pioarduino/platform-espressif32.git#4cf6992078a95fb9ab8352fe7811f4eec0d359af
board = waveshare-esp32p4-eth
framework = espidf

board_build.flash_size = 16MB
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_WAVESHARE_ESP32P4_ETH
    -DESP32_OT_WEB_HTTP_ONLY=0
    -DETH_PHY_TYPE=101
    -DETH_PHY_ADDR=1
    -DETH_PHY_RST_GPIO=51
    -DETH_MDC_GPIO=31
    -DETH_MDIO_GPIO=52
    -DETH_RMII_CLK_MODE=EMAC_CLK_EXT_IN
    -DETH_RMII_CLK_GPIO=50
    -DCONFIG_LITTLEFS_MAX_PARTITIONS=3
    -DCONFIG_ETH_ENABLE_PROMISCUOUS=1

board_build.partitions = partitions.csv

upload_speed = 921600
monitor_speed = 115200

extra_scripts =
  pre:scripts/platformio_provision.py
  pre:scripts/fix_esp32p4_toolchain_path.py
  pre:scripts/convert_html_in_code.py

board_build.sdkconfig_defaults = sdkconfig.esp32p4.defaults
