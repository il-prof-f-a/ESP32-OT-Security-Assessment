<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 OT Security — Configuration</title>
<style>
:root{--ink:#10243e;--muted:#63748a;--line:#d8e1ec;--accent:#087f8c;--paper:#f5f8fb;--warn:#a85b00}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,Segoe UI,sans-serif}
.top{background:linear-gradient(120deg,#10243e,#087f8c);color:#fff;padding:1.3rem 5vw;display:flex;justify-content:space-between;align-items:center;gap:1rem}.top h1{margin:0;font-size:1.35rem}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff66;padding:.45rem .7rem;border-radius:7px}
main{max-width:1200px;margin:1.5rem auto;padding:0 1rem}.toolbar,.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 5px 20px #10243e0d}.toolbar{padding:1rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.toolbar button{border:0;border-radius:7px;padding:.55rem .8rem;background:var(--accent);color:#fff;cursor:pointer}.toolbar button.secondary{background:#526579}.toolbar button.warn{background:var(--warn)}#state{color:var(--muted);margin-left:auto}
.layout{display:grid;grid-template-columns:225px 1fr;gap:1rem;margin-top:1rem}.sections{padding:.7rem;height:max-content;position:sticky;top:1rem}.sections button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:.65rem;border-radius:7px;color:var(--ink);cursor:pointer}.sections button.active,.sections button:hover{background:#dff2f2;color:#075a62}.card{padding:1.2rem}.card h2{margin-top:0}.hint{color:var(--muted);line-height:1.5}.notice{background:#fff4df;border-left:4px solid #d58b16;padding:.7rem;margin:.8rem 0}.field{display:grid;grid-template-columns:minmax(12rem,1fr) minmax(12rem,1.2fr);gap:.7rem;padding:.65rem 0;border-bottom:1px solid #edf1f5}.field label{font-weight:600}.field small{display:block;color:var(--muted);font-weight:400;margin-top:.2rem}.field input,.field textarea,.field select{width:100%;padding:.45rem;border:1px solid var(--line);border-radius:6px;font:inherit}.field input[type=checkbox]{width:auto}.locked{color:var(--muted);font-style:italic}.secret{color:var(--warn)}pre{white-space:pre-wrap;background:#10243e;color:#e8f1fa;padding:1rem;border-radius:8px;max-height:55vh;overflow:auto}
@media(max-width:720px){.layout{grid-template-columns:1fr}.sections{position:static}.field{grid-template-columns:1fr}}
</style>
<header class="top"><h1>⚙️ Configuration</h1><a href="/">← Dashboard</a></header>
<main>
 <div class="toolbar" role="toolbar" aria-label="Configuration actions">
  <button onclick="loadSnapshot('current')">Load current</button><button onclick="loadSnapshot('saved')">Load saved</button><button class="secondary" onclick="loadSnapshot('defaults')">Load defaults</button><button class="secondary" onclick="document.getElementById('import').click()">Import JSON</button><button onclick="validateDraft()">Validate</button><button onclick="saveDevice()">Save to device</button><button class="secondary" onclick="saveAs()">Save as</button>
  <input id="import" type="file" accept="application/json,.json" hidden onchange="importJson(event)"><span id="state" role="status">Loading…</span>
 </div>
 <div class="notice"><strong>Safe editing:</strong> values shown here are a draft until “Save to device”. Secrets are never returned; an omitted secret remains unchanged. Security and compile-time locked settings cannot be overridden from this page.</div>
 <div class="layout"><nav class="sections card" id="sections" aria-label="Configuration sections"></nav><section class="card"><div id="content"><p class="hint">Loading configuration schema…</p></div></section></div>
</main>
<script>
// Snapshot response fields: secrets_present, restart_required_paths, locked_paths.
(function(){const sid=new URLSearchParams(location.search).get('sid');if(sid){window.__sidToken=sid;const f=window.fetch;window.fetch=(u,o={})=>{o={...o,headers:{...(o.headers||{}),Authorization:'Bearer '+sid}};return f(u,o)}}})();
let schema=[],draft={},baseRevision='',dirty=false,active='';
const sectionNames=['debug','security','network','ids','signatures','plugins','reporting','scanner','watchdog','gpio'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setState(s){document.getElementById('state').textContent=s}
function getPath(o,path){return path.split('.').reduce((v,k)=>v&&v[k],o)}
function setPath(o,path,v){const p=path.split('.');let n=o;for(let i=0;i<p.length-1;i++)n=n[p[i]]||(n[p[i]]={});n[p.at(-1)]=v}
function renderSections(){const nav=document.getElementById('sections');nav.innerHTML=sectionNames.map((s,i)=>`<button class="${i===0?'active':''}" data-section="${s}">${s}</button>`).join('');nav.onclick=e=>{if(e.target.dataset.section){active=e.target.dataset.section;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===e.target));render()}};active=sectionNames[0]}
function render(){const fields=schema.filter(f=>f.path.split('.')[0]===active);let html=`<h2>${esc(active[0].toUpperCase()+active.slice(1))}</h2><p class="hint">Edit the draft values for this section. Changes are validated before persistence.</p>`;for(const f of fields){const val=getPath(draft,f.path), secret=f.secret||/password|token|private_key|hash/i.test(f.path), locked=f.read_only||f.locked;let control='';if(secret)control='<span class="secret">Configured — use the dedicated credential action to change it</span>';else if(locked)control=`<span class="locked">${esc(String(val??'not available'))} — locked by firmware policy</span>`;else if(f.type==='boolean')control=`<input type="checkbox" data-path="${esc(f.path)}" ${val?'checked':''}>`;else if(f.type==='array')control=`<textarea data-path="${esc(f.path)}" rows="2">${esc(JSON.stringify(val??[]))}</textarea>`;else control=`<input data-path="${esc(f.path)}" value="${esc(val??'')}" ${f.type==='number'?'type="number"':''}>`;html+=`<div class="field"><label>${esc(f.label||f.path)}<small>${esc(f.help||'')}</small></label><div>${control}</div></div>`}if(!fields.length)html+='<p class="hint">No editable fields are reported for this section.</p>';document.getElementById('content').innerHTML=html;document.querySelectorAll('[data-path]').forEach(el=>el.onchange=()=>{let v=el.type==='checkbox'?el.checked:el.value;if(el.type==='number')v=Number(v);if(el.tagName==='TEXTAREA'){try{v=JSON.parse(el.value)}catch(err){setState('Invalid array JSON: '+err.message);return}}setPath(draft,el.dataset.path,v);dirty=true;setState('Draft edited')})}
async function api(path,opts){const r=await fetch(path,{cache:'no-store',...(opts||{})});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return r.json().catch(()=>({}))}
async function loadSchema(){try{const r=await api('/api/config/editor/schema');schema=r.fields||[];renderSections();await loadSnapshot('current')}catch(e){setState('Error: '+e.message)}}
async function loadSnapshot(source){if(dirty&&!confirm('Discard unsaved changes?'))return;setState('Loading '+source+'…');try{const r=await api('/api/config/editor/snapshot?source='+source);draft=r.values||{};baseRevision=r.revision||'';dirty=false;render();setState(source+' loaded')}catch(e){setState('Error: '+e.message)}}
async function validateDraft(){setState('Validating…');try{const r=await api('/api/config/editor/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({base_revision:baseRevision,values:draft})});setState(r.valid?'Valid — ready to save':'Validation failed');if(!r.valid&&r.errors?.length)alert(r.errors.map(x=>`${x.path}: ${x.message}`).join('\n'));if(r.warnings?.length)alert(r.warnings.join('\n'));return !!r.valid}catch(e){setState('Invalid: '+e.message);return false}}
async function saveDevice(){if(!dirty){setState('No changes');return}if(!await validateDraft())return;if(!confirm('Save this validated configuration to the device?'))return;setState('Saving…');try{const r=await api('/api/config/editor/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({base_revision:baseRevision,values:draft})});dirty=false;baseRevision=r.revision||baseRevision;setState(r.restart_required_paths?.length?'Saved — restart required':'Saved')}catch(e){setState('Save failed: '+e.message)}}
function saveAs(){const name=(prompt('File name','esp32-ot-config.json')||'').replace(/[^\w.-]/g,'_');if(!name)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}));a.download=name.endsWith('.json')?name:name+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJson(e){const file=e.target.files?.[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const v=JSON.parse(rd.result);if(!v||Array.isArray(v))throw Error('Root must be an object');draft=v;dirty=true;render();setState('Imported draft — validate before saving')}catch(err){setState('Import failed: '+err.message)}};rd.readAsText(file);e.target.value=''}
loadSchema();
</script>
</html>
