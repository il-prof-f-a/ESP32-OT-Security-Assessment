<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 OT Security — Configuration</title>
<style>
:root{--ink:#222;--muted:#63748a;--line:#ddd;--accent:#007;--nav:#06a;--paper:#f6f6f6;--surface:#fff;--border:#ddd;--soft:#f8f9fa;--warn:#8a4b00;--success:#268c2f}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,"Helvetica Neue",Arial;margin:0;padding:1rem;background:var(--paper);color:var(--ink)}
.container{width:100%;max-width:none;margin:0 auto}.navbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 1rem;padding:1rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.08)}.nav-brand{font-weight:700;color:#111}.nav-links{display:flex;gap:.5rem}.nav-btn{background:var(--nav);color:#fff;border:none;padding:.6rem 1rem;border-radius:8px;text-decoration:none;display:inline-block}.nav-btn:hover{background:#07b}
.card,.toolbar{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:1rem;margin-bottom:1rem}.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.toolbar button{border:0;border-radius:6px;padding:.5rem 1rem;background:var(--accent);color:#fff;cursor:pointer}.toolbar button.secondary{background:#555}.toolbar button:hover{background:#008}.toolbar button.secondary:hover{background:#666}#state{color:var(--muted);margin-left:auto}
.layout{display:grid;grid-template-columns:225px 1fr;gap:1rem}.sections{padding:.7rem;height:max-content;position:sticky;top:1rem}.sections button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:.65rem;border-radius:7px;color:var(--ink);cursor:pointer}.sections button.active,.sections button:hover{background:#e8eefc;color:#172b8c}.card h2{font-size:1.15rem;margin:0 0 .5rem}.hint{color:var(--muted);line-height:1.5}.notice{background:#fff3cd;border-left:4px solid #d39e00;padding:.7rem;margin:.8rem 0;color:#664d03}.subsection-card{border:1px solid #dbe2ec;border-radius:8px;background:#fbfcfe;padding:.85rem;margin:0 0 .85rem}.subsection-card legend{padding:0 .35rem;font-weight:700;color:#172b8c}.subsection-title{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;font-size:1rem;margin:0 0 .35rem;color:#172b8c}.subsection-title code{font-size:.72rem;font-weight:400;color:#718096;background:#eef2f7;padding:.15rem .35rem;border-radius:4px}.field{display:grid;grid-template-columns:minmax(12rem,1fr) minmax(12rem,1.2fr);gap:.7rem;padding:.65rem 0;border-bottom:1px solid #edf1f5}.field:last-child{border-bottom:0}.field label{font-weight:600}.field small{display:block;color:var(--muted);font-weight:400;margin-top:.2rem}.field input,.field textarea,.field select{width:100%;padding:.45rem .6rem;border:1px solid #ccc;border-radius:4px;background:#fff;color:#222;font:inherit}.field input[type=checkbox]{width:auto}.locked{color:var(--muted);font-style:italic}.secret{color:var(--warn);font-style:italic}.action-status{margin-top:.6rem;color:var(--muted)}
@media(max-width:720px){.layout{grid-template-columns:1fr}.sections{position:static}.field{grid-template-columns:1fr}#state{width:100%;margin-left:0}}
</style>
<div class="container">
<nav class="navbar"><div class="nav-brand">ESP32 OT Security - Configuration</div><div class="nav-links"><a href="/" class="btn nav-btn">← Dashboard</a></div></nav>
<main>
 <div class="toolbar" role="toolbar" aria-label="Configuration actions">
  <button onclick="loadSnapshot('current')">Load current</button><button onclick="loadSnapshot('saved')">Load saved</button><button class="secondary" onclick="loadSnapshot('defaults')">Load defaults</button><button class="secondary" onclick="document.getElementById('import').click()">Import JSON</button><button onclick="validateDraft()">Validate</button><button onclick="saveDevice()">Save to device</button><button class="secondary" onclick="saveAs()">Save as</button>
  <input id="import" type="file" accept="application/json,.json" hidden onchange="importJson(event)"><span id="state" role="status">Loading…</span>
 </div>
 <div class="notice"><strong>Safe editing:</strong> values shown here are a draft until “Save to device”. Secrets are never returned; an omitted secret remains unchanged. Security and compile-time locked settings cannot be overridden from this page.</div>
 <div class="layout"><nav class="sections card" id="sections" aria-label="Configuration sections"></nav><section class="card"><div id="content"><p class="hint">Loading configuration schema…</p></div></section></div>
</main>
</div>
<script>
// Snapshot response fields: secrets_present, restart_required_paths, locked_paths.
(function(){const sid=new URLSearchParams(location.search).get('sid');if(sid){window.__sidToken=sid;const f=window.fetch;window.fetch=(u,o={})=>{o={...o,headers:{...(o.headers||{}),Authorization:'Bearer '+sid}};return f(u,o)};document.querySelectorAll('.nav-btn').forEach(link=>{const href=link.getAttribute('href');if(!href||href.includes('sid='))return;link.setAttribute('href',href+(href.includes('?')?'&':'?')+'sid='+encodeURIComponent(sid))})}})();
let schema=[],draft={},baseRevision='',dirty=false,active='';
const sectionNames=['debug','security','network','ids','signatures','plugins','reporting','scanner','watchdog','gpio'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setState(s){document.getElementById('state').textContent=s}
function getPath(o,path){return path.split('.').reduce((v,k)=>v&&v[k],o)}
function setPath(o,path,v){const p=path.split('.');let n=o;for(let i=0;i<p.length-1;i++)n=n[p[i]]||(n[p[i]]={});n[p.at(-1)]=v}
const sectionLabels={debug:'Debug',security:'Security',network:'Network',ids:'IDS',signatures:'CVE Signatures',plugins:'Plugins',reporting:'Reporting',scanner:'Scanner & Fuzzing',watchdog:'Watchdog',gpio:'GPIO'};
const subsectionAliases={'network.wifi':'Wi-Fi','network.ethernet':'Ethernet'};
function humanSectionName(name){return sectionLabels[name]||name.replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function humanSubsectionName(section,name){if(!name)return 'General';return subsectionAliases[`${section}.${name}`]||name.split(/[._-]+/).map(part=>part?part[0].toUpperCase()+part.slice(1):part).join(' ')}
function groupFieldsBySubsection(fields){const groups={};for(const field of fields){const parts=String(field.path||'').split('.');const key=parts.length>2?parts[1]:'';(groups[key]||(groups[key]=[])).push(field)}return groups}
function renderSections(){const nav=document.getElementById('sections');nav.innerHTML=sectionNames.map((s,i)=>`<button class="${i===0?'active':''}" data-section="${s}">${esc(humanSectionName(s))}</button>`).join('');nav.onclick=e=>{if(e.target.dataset.section){active=e.target.dataset.section;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===e.target));render()}};active=sectionNames[0]}
function renderField(f){const val=getPath(draft,f.path),secret=f.secret||/password|token|private_key|hash/i.test(f.path),locked=f.read_only||f.locked;let control='';if(secret)control='<span class="secret">Configured — use the dedicated credential action to change it</span>';else if(locked)control=`<span class="locked">${esc(String(val??'not available'))} — locked by firmware policy</span>`;else if(f.type==='boolean')control=`<input type="checkbox" data-path="${esc(f.path)}" ${val?'checked':''}>`;else if(f.type==='array')control=`<textarea data-path="${esc(f.path)}" rows="2">${esc(JSON.stringify(val??[]))}</textarea>`;else control=`<input data-path="${esc(f.path)}" value="${esc(val??'')}" ${f.type==='number'?'type="number"':''}>`;return `<div class="field"><label>${esc(f.label||f.path)}<small>${esc(f.help||'')}</small></label><div>${control}</div></div>`}
function render(){const fields=schema.filter(f=>f.path.split('.')[0]===active);let html=`<h2>${esc(humanSectionName(active))}</h2><p class="hint">Edit the draft values for this section. Changes are validated before persistence.</p>`;if(active==='watchdog')html+='<div class="notice"><strong>Boot-time setting:</strong> the effective watchdog is loaded from the device filesystem configuration, which takes precedence over the public build defaults. Saving this section requires a device restart; the active timeout is exposed by <code>/api/config/watchdog</code>.</div>';const groups=groupFieldsBySubsection(fields);const keys=Object.keys(groups);if(keys.length){for(const key of keys){const technical=key?`${active}.${key}`:active;html+=`<fieldset class="subsection-card"><legend><span class="subsection-title">${esc(humanSubsectionName(active,key))}<code>${esc(technical)}</code></span></legend>${groups[key].map(renderField).join('')}</fieldset>`}}else html+='<p class="hint">No editable fields are reported for this section.</p>';document.getElementById('content').innerHTML=html;document.querySelectorAll('[data-path]').forEach(el=>el.onchange=()=>{let v=el.type==='checkbox'?el.checked:el.value;if(el.type==='number')v=Number(v);if(el.tagName==='TEXTAREA'){try{v=JSON.parse(el.value)}catch(err){setState('Invalid array JSON: '+err.message);return}}setPath(draft,el.dataset.path,v);dirty=true;setState('Draft edited')})}
async function api(path,opts){const r=await fetch(path,{cache:'no-store',...(opts||{})});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return r.json().catch(()=>({}))}
async function loadSchema(){try{const r=await api('/api/config/editor/schema');schema=r.fields||[];renderSections();await loadSnapshot('current')}catch(e){setState('Error: '+e.message)}}
async function loadSnapshot(source){if(dirty&&!confirm('Discard unsaved changes?'))return;setState('Loading '+source+'…');try{const r=await api('/api/config/editor/snapshot?source='+source);draft=r.values||{};baseRevision=r.revision||'';dirty=false;render();setState(source+' loaded')}catch(e){setState('Error: '+e.message)}}
async function validateDraft(){setState('Validating…');try{const r=await api('/api/config/editor/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({base_revision:baseRevision,values:draft})});setState(r.valid?'Valid — ready to save':'Validation failed');if(!r.valid&&r.errors?.length)alert(r.errors.map(x=>`${x.path}: ${x.message}`).join('\n'));if(r.warnings?.length)alert(r.warnings.join('\n'));return !!r.valid}catch(e){setState('Invalid: '+e.message);return false}}
async function saveDevice(){if(!dirty){setState('No changes');return}if(!await validateDraft())return;if(!confirm('Save this validated configuration to the device?'))return;setState('Saving…');try{const r=await api('/api/config/editor/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({base_revision:baseRevision,values:draft})});dirty=false;baseRevision=r.revision||baseRevision;setState(r.restart_required_paths?.length?'Saved — restart required':'Saved')}catch(e){setState('Save failed: '+e.message)}}
function saveAs(){const name=(prompt('File name','esp32-ot-config.json')||'').replace(/[^\w.-]/g,'_');if(!name)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}));a.download=name.endsWith('.json')?name:name+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJson(e){const file=e.target.files?.[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const v=JSON.parse(rd.result);if(!v||Array.isArray(v))throw Error('Root must be an object');draft=v;dirty=true;render();setState('Imported draft — validate before saving')}catch(err){setState('Import failed: '+err.message)}};rd.readAsText(file);e.target.value=''}
loadSchema();
</script>
</html>
