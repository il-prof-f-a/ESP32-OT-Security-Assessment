<!doctype html>
<html><meta charset="utf-8"/><title>Serial Monitor</title>
<style>
body{font-family:system-ui;margin:1rem;background:#f6f6f6}
.card{background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:1rem;margin-bottom:1rem}
.btn{background:#007;color:#fff;border:none;padding:.5rem 1rem;border-radius:6px;cursor:pointer;margin-right:.5rem}
.nav-btn{background:#06a;color:#fff;border:none;padding:.6rem 1rem;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.nav-btn:hover{background:#07b}
.status{padding:.5rem;border-radius:4px;margin-bottom:.8rem}
.status.ok{background:#d4edda;color:#155724}
.status.err{background:#f8d7da;color:#721c24}
.config-section{background:#f8f9fa;padding:1rem;border-radius:6px;margin:1rem 0}
.form-group{margin:0.5rem 0}
.form-group label{display:block;font-weight:600;margin-bottom:0.25rem}
.form-control{width:100%;padding:0.375rem;border:1px solid #ced4da;border-radius:4px}
.checkbox-group{display:flex;flex-wrap:wrap;gap:1rem;margin:0.5rem 0}
.checkbox-item{display:flex;align-items:center;gap:0.25rem}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:1rem 0}
.stat-card{background:#e9ecef;padding:0.75rem;border-radius:4px;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#007}
.stat-label{font-size:0.875rem;color:#666;margin-top:0.25rem}
.output-area{background:#000;color:#0f0;padding:1rem;border-radius:4px;font-family:monospace;font-size:0.875rem;height:300px;overflow-y:auto;border:1px solid #333;white-space:pre-wrap}
.controls{display:flex;gap:1rem;align-items:center;margin:1rem 0;flex-wrap:wrap}
</style>

<div class="card">
    <h1>🖥️ Serial Monitor</h1>
    <div class="controls">
        <a href="/" class="btn nav-btn">← Dashboard</a>
    </div>
</div>

<div id="status"></div>

<!-- Configuration Section -->
<div class="card">
    <h2>Serial Reporting Configuration</h2>
    <div class="config-section">
        <div class="form-group">
            <label>
                <input type="checkbox" id="enabled" checked>
                Enable Serial Reporting
            </label>
        </div>

        <div class="form-group">
            <label for="log-level">Log Level:</label>
            <select id="log-level" class="form-control">
                <option value="INFO">INFO</option>
                <option value="WARNING">WARNING</option>
                <option value="ERROR">ERROR</option>
                <option value="DEBUG">DEBUG</option>
            </select>
        </div>

        <div class="form-group">
            <label>Protocol Filters:</label>
            <div class="checkbox-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="protocol-modbus" value="modbus" checked>
                    <label for="protocol-modbus">Modbus</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="protocol-s7" value="s7" checked>
                    <label for="protocol-s7">S7</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="protocol-opcua" value="opcua" checked>
                    <label for="protocol-opcua">OPC UA</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="protocol-ethernetip" value="ethernetip" checked>
                    <label for="protocol-ethernetip">EtherNet/IP</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="protocol-profinet" value="profinet" checked>
                    <label for="protocol-profinet">PROFINET</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Event Types:</label>
            <div class="checkbox-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="event-traffic" value="traffic" checked>
                    <label for="event-traffic">Traffic</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="event-alert" value="alert" checked>
                    <label for="event-alert">Alerts</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="event-discovery" value="discovery" checked>
                    <label for="event-discovery">Discovery</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="max-rate">Max Events/sec:</label>
            <input type="number" id="max-rate" class="form-control" value="10" min="1" max="100">
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="show-details" checked>
                Show Event Details
            </label>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="loadConfig()">Load Config</button>
        <button class="btn" onclick="saveConfig()">Save Config</button>
    </div>
</div>


<!-- Live Serial Output -->
<div class="card">
    <h2>Serial Output</h2>
    <div class="controls">
        <button class="btn" onclick="startSerialOutput()">Start</button>
        <button class="btn" onclick="stopSerialOutput()">Stop</button>
        <button class="btn" onclick="clearSerialOutput()">Clear</button>
        <label>Refresh rate: <select id="refresh-rate"><option value="1000">1s</option><option value="2000" selected>2s</option><option value="5000">5s</option></select></label>
    </div>
    <div class="output-area" id="output-area">
<!-- Live output will appear here -->
    </div>
</div>

<script>
// Session handling
(function() {
    const urlParams = new URLSearchParams(window.location.search);
    const sessionToken = urlParams.get('sid');

    if (sessionToken) {
        const originalFetch = window.fetch;
        if (!window.__apiFetchQueue) {
            window.__apiFetchQueue = Promise.resolve();
        }
        window.fetch = function(url, options = {}) {
            const isApiCall = typeof url === 'string' && url.startsWith('/api/');
            if (!isApiCall) {
                return originalFetch.call(this, url, options);
            }

            const opts = {...options};
            opts.headers = {...(options && options.headers) || {}};
            opts.headers['Authorization'] = 'Bearer ' + sessionToken;

            const runner = () => originalFetch.call(window, url, opts);
            const queued = window.__apiFetchQueue.then(runner, runner);
            window.__apiFetchQueue = queued.catch(() => {});
            return queued;
        };

        document.querySelectorAll('.nav-btn').forEach(link => {
            const href = link.getAttribute('href');
            if (href && !href.includes('sid=')) {
                link.setAttribute('href', href + '?sid=' + encodeURIComponent(sessionToken));
            }
        });
    }
})();

function status(msg, err) {
    const s = document.getElementById('status');
    s.className = 'status ' + (err ? 'err' : 'ok');
    s.textContent = msg;
    setTimeout(() => s.innerHTML = '', 3000);
}

async function loadConfig(override) {
    try {
        const config = override || await (async () => {
            const response = await fetch('/api/report/serial/config');
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return await response.json();
        })();
        const cfg = config.configuration || config;

        // Update form fields
        document.getElementById('enabled').checked = !!config.enabled;
        document.getElementById('log-level').value = cfg.log_level || 'INFO';
        document.getElementById('max-rate').value = (typeof cfg.max_rate_per_sec === 'number') ? cfg.max_rate_per_sec : 100;
        document.getElementById('show-details').checked = !!cfg.show_details;

        // Update protocol checkboxes
        const protos = Array.isArray(cfg.include_protocols) ? cfg.include_protocols : [];
        document.getElementById('protocol-modbus').checked = protos.includes('modbus');
        document.getElementById('protocol-s7').checked = protos.includes('s7');
        document.getElementById('protocol-opcua').checked = protos.includes('opcua');
        document.getElementById('protocol-ethernetip').checked = protos.includes('ethernetip');
        document.getElementById('protocol-profinet').checked = protos.includes('profinet');

        // Update event type checkboxes
        const events = Array.isArray(cfg.include_events) ? cfg.include_events : [];
        document.getElementById('event-traffic').checked = events.includes('traffic');
        document.getElementById('event-alert').checked = events.includes('alert');
        document.getElementById('event-discovery').checked = events.includes('discovery');

        status('Configuration loaded successfully');
    } catch (e) {
        status('Error loading config: ' + e.message, true);
    }
}

async function saveConfig() {
    try {
        const config = {
            enabled: document.getElementById('enabled').checked,
            format: "JSON",
            verbosity: "VERBOSE",
            configuration: {
                max_rate_per_sec: parseInt(document.getElementById('max-rate').value || '100', 10),
                log_level: document.getElementById('log-level').value,
                show_details: document.getElementById('show-details').checked,
                include_protocols: [],
                include_events: []
            }
        };

        // Collect protocol filters
        if (document.getElementById('protocol-modbus').checked) config.configuration.include_protocols.push('modbus');
        if (document.getElementById('protocol-s7').checked) config.configuration.include_protocols.push('s7');
        if (document.getElementById('protocol-opcua').checked) config.configuration.include_protocols.push('opcua');
        if (document.getElementById('protocol-ethernetip').checked) config.configuration.include_protocols.push('ethernetip');
        if (document.getElementById('protocol-profinet').checked) config.configuration.include_protocols.push('profinet');

        // Collect event type filters
        if (document.getElementById('event-traffic').checked) config.configuration.include_events.push('traffic');
        if (document.getElementById('event-alert').checked) config.configuration.include_events.push('alert');
        if (document.getElementById('event-discovery').checked) config.configuration.include_events.push('discovery');

        const response = await fetch('/api/report/serial/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(config)
        });

        if (!response.ok) throw new Error('HTTP ' + response.status);

        status('Configuration saved successfully');
    } catch (e) {
        status('Error saving config: ' + e.message, true);
    }
}

// Serial output management
let serialInterval = null;
let lastLogTimestamp = 0;

function startSerialOutput() {
    if (serialInterval) return; // Already running

    const refreshRate = parseInt(document.getElementById('refresh-rate').value) || 2000;
    serialInterval = setInterval(loadIncrementalLogs, refreshRate);
    loadIncrementalLogs(); // Load immediately

    status('Serial output monitoring started');
}

function stopSerialOutput() {
    if (serialInterval) {
        clearInterval(serialInterval);
        serialInterval = null;
        status('Serial output monitoring stopped');
    }
}

function clearSerialOutput() {
    document.getElementById('output-area').textContent = '';
    lastLogTimestamp = 0;
    status('Serial output cleared');
}

async function loadIncrementalLogs() {
    try {
        // Get latest logs since last timestamp
        const response = await fetch('/api/logs?name=app.log&tail=50&since=' + lastLogTimestamp);
        if (!response.ok) return;

        const logs = await response.text();
        if (!logs.trim()) return;

        const outputArea = document.getElementById('output-area');
        const lines = logs.trim().split('\n');

        // Process each line and prepend to output (newest at top)
        lines.forEach(line => {
            if (line.trim()) {
                // Extract timestamp if present to track last entry
                const timestampMatch = line.match(/\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\]/);
                if (timestampMatch) {
                    const timestamp = new Date(timestampMatch[1]).getTime();
                    if (timestamp > lastLogTimestamp) {
                        lastLogTimestamp = timestamp;
                    }
                }

                // Prepend line to output area (newest on top)
                const newLine = document.createTextNode(line + '\n');
                outputArea.insertBefore(newLine, outputArea.firstChild);
            }
        });

        // Limit output to max 500 lines to prevent memory issues
        const allLines = outputArea.textContent.split('\n');
        if (allLines.length > 500) {
            outputArea.textContent = allLines.slice(0, 500).join('\n');
        }

    } catch (e) {
        console.error('Error loading incremental logs:', e);
    }
}

// Load initial data
(async () => {
    try {
        // 1 sola chiamata per bootstrap pagina (riduce fan-out iniziale).
        let boot = null;
        try {
            const r = await fetch('/api/page/bootstrap?name=serial_monitor', { cache: 'no-store' });
            if (r.ok) boot = await r.json();
        } catch (_) {}
        if (boot && boot.data && boot.data.serial_config) {
            await loadConfig(boot.data.serial_config);
        } else {
            await loadConfig();
        }
    } catch (err) {
        console.error('Serial monitor initial load failed:', err);
    }
})();
</script>
</html>
